name: validate

on:
  push:
    branches: [main]
    paths: ["skills/**", "skills.sh.json", "scripts/validate.py", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["skills/**", "skills.sh.json", "scripts/validate.py", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate skills
        run: python3 scripts/validate.py
