[project]
name = "{{PROJECT}}"
version = "0.1.0"
description = "{{PROJECT}} web application"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.3",
    "django-htmx==1.29.0",
    "granian==2.8.8",
]

[dependency-groups]
dev = [
    "django-types==0.24.0",
    "playwright==1.65.1",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "pytest-playwright>=0.7",
    "ruff>=0.14",
    "ty>=0.0.105",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE}}"]

[tool.pack-python]
profile = "web"
package = "{{PACKAGE}}"

[tool.pytest.ini_options]
minversion = "8.0"
DJANGO_SETTINGS_MODULE = "{{PACKAGE}}.settings"
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: browser flow driven by Playwright",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/migrations/*",
    "*/settings.py",
    "*/asgi.py",
    "*/wsgi.py",
    "*/apps.py",
    "manage.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]
allowed-confusables = ["×", "·"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
