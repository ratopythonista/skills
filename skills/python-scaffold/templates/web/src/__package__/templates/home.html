{% extends "base.html" %}
{% block content %}
  <h1 class="text-2xl font-semibold">{{PROJECT}}</h1>
  <p class="mt-2 text-slate-600">Scaffolded with the pack-python web profile.</p>
  <button
    class="mt-6 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
    hx-get="{% url 'ping' %}"
    hx-target="#ping"
    hx-swap="innerHTML"
  >Ping</button>
  <section id="ping" class="mt-4"></section>
{% endblock %}
